# Render Blueprint for the interim STATIC deploy: only the website (no API, no database).
# The contact form is disabled until Phase 4, so nothing here needs a backend.
# Use it with New → Blueprint → set "Blueprint file path" to render.static.yaml.
# The full stack (web service + Postgres) stays in render.yaml for the Phase 8 launch.
services:
  - type: web
    name: raluca-site-static
    runtime: static
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build -w @raluca/shared && npm run build -w @raluca/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_SITE_URL
        sync: false # https://<your-service>.onrender.com for now
    routes:
      # Single-page app: every path that is not a file serves index.html (React Router handles it).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
