# Render Blueprint — one environment (web service + Postgres).
# Staging and production are two Blueprint instances of this file, created from the `staging` and
# `main` branches respectively; per-environment values (PUBLIC_SITE_URL, secrets) are set in the dashboard.
# Verify current plan names/prices on render.com before launch; the free tiers sleep / expire.

databases:
  - name: raluca-db
    databaseName: raluca
    user: raluca
    region: frankfurt # closest to RO/IT audience
    plan: basic-256mb

services:
  - type: web
    name: raluca-site
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: raluca-db
          property: connectionString
      - key: PUBLIC_SITE_URL
        sync: false # e.g. https://staging.ralucaandrenacci.com, then https://ralucaandrenacci.com
      # Web build-time variables (public; must be set before the build runs)
      - key: VITE_SITE_URL
        sync: false # same value as PUBLIC_SITE_URL
      - key: VITE_GTM_ID
        sync: false # GTM-XXXXXXX; leave empty on staging
